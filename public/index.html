<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Minecraft Color Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-wrap">
        <div class="logo-icon">🎨</div>
        <span class="logo-title">MC Color Preview</span>
      </div>
      <a href="https://discord.lunanw.online" target="_blank" class="discord-btn">
        <svg viewBox="0 0 127.14 96.36" width="16" height="16" fill="currentColor">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.1,46,96,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        LunaNW Discord
      </a>
    </header>

    <!-- 1. Text & Gradient Settings -->
    <div class="card compact-section">
      <div class="section-label">1. Văn bản & Tạo Gradient</div>
      
      <div class="input-row">
        <input type="text" id="plainText" class="modern-input" placeholder="Nhập văn bản thường để tự động tạo gradient..." value="Minecraft Color" />
        
        <div class="format-toggles">
          <label class="toggle-btn" title="Bold"><input type="checkbox" id="fmtB"><span>B</span></label>
          <label class="toggle-btn" title="Italic"><input type="checkbox" id="fmtI"><span>I</span></label>
          <label class="toggle-btn" title="Underline"><input type="checkbox" id="fmtU"><span style="text-decoration:underline">U</span></label>
          <label class="toggle-btn" title="Strikethrough"><input type="checkbox" id="fmtS"><span style="text-decoration:line-through">S</span></label>
        </div>
      </div>
      
      <div class="text-tools">
        <button id="btnUpper" class="tool-btn" title="VIẾT HOA TOÀN BỘ">AA</button>
        <button id="btnLower" class="tool-btn" title="viết thường toàn bộ">aa</button>
        <button id="btnTitle" class="tool-btn" title="Viết Hoa Chữ Đầu">Aa</button>
      </div>

      <div class="color-row">
        <div class="color-controls">
          <span class="sub-label">Dải màu:</span>
          <button class="icon-btn" id="btnAddColor" title="Thêm màu">+</button>
          <button class="icon-btn" id="btnRemoveColor" title="Xoá màu">−</button>
          <button class="icon-btn random" id="btnRandomColors" title="Màu ngẫu nhiên">🎲 Random</button>
        </div>
        <div id="colorStops" class="stops-container">
          <!-- JS injected -->
        </div>
        <div id="gradientBar" class="gradient-bar"></div>
      </div>
    </div>

    <!-- 2. Raw Code & Format -->
    <div class="card compact-section">
      <div class="section-header-flex">
        <div class="section-label">2. Mã màu (Copy hoặc tự chỉnh sửa)</div>
        <select id="formatSelect" class="modern-select">
          <option value="hex">Bukkit (&#RRGGBB)</option>
          <option value="minimessage">MiniMessage (&lt;gradient&gt;)</option>
          <option value="legacy">Legacy (&amp;x...)</option>
        </select>
      </div>
      
      <textarea id="rawInput" class="modern-textarea" rows="3" placeholder="Mã màu sẽ hiện ở đây. Bạn cũng có thể tự dán mã màu Minecraft vào ô này để xem trước..."></textarea>
      
      <div class="action-row">
        <button id="copyBtn" class="btn btn-primary">📋 Copy Mã</button>
        <button id="clearBtn" class="btn btn-secondary">✕ Xoá</button>
      </div>
    </div>

    <!-- 3. Preview -->
    <div class="card preview-section bg-dark" id="previewContainer">
      <div class="preview-header">
        <span class="preview-title"><span class="pulse-dot"></span> XEM TRƯỚC</span>
        <div class="bg-switcher">
          <button class="bg-btn active" data-bg="dark">⬛</button>
          <button class="bg-btn" data-bg="light">⬜</button>
          <button class="bg-btn" data-bg="grass">🌿</button>
        </div>
      </div>
      <div class="preview-bg"></div>
      <div class="minecraft-preview" id="previewBox">
        <span class="placeholder-text">Đang đợi nội dung...</span>
      </div>
    </div>


    <!-- Quick examples -->
    <div class="examples-section card">
      <div class="section-title">⚡ Ví dụ nhanh</div>
      <div class="examples-grid">
        <div class="example-card" data-text="<gradient:#ff9900:#ff0000>Sóng gió phủ đời trai</gradient>&#10;<gradient:#00ff00:#0099ff>Tương lai nhờ nhà vợ</gradient>">
          <div class="example-preview"></div>
        </div>
        <div class="example-card" data-text="<rainbow>Cần cù thì bù siêng năng</rainbow>&#10;<rainbow>Chỉ có làm thì mới có ăn!</rainbow>">
          <div class="example-preview"></div>
        </div>
        <div class="example-card" data-text="&4&l[!] &c&lCẢNH BÁO HỆ THỐNG &4&l[!]&#10;&fHành vi sử dụng Hack/Cheat sẽ bị &cbanned &fvĩnh viễn!">
          <div class="example-preview"></div>
        </div>
        <div class="example-card" data-text="<gradient:#ff00ff:#00ffff>Thất tình tự tử đu cây dừa</gradient>&#10;<gradient:#00ffff:#ff00ff>Ai ngờ dừa mục té lòi xương =))</gradient>">
          <div class="example-preview"></div>
        </div>
        <div class="example-card" data-text="&8[&e&lVIP+&8] &fĐại Gia &eDânChơi&f:&#10;&aTuy anh không nhiều tiền bạc nhưng anh dư kim cương!">
          <div class="example-preview"></div>
        </div>
        <div class="example-card" data-text="&8[&a+&8] &7Người chơi &bNoobMaster69 &7vừa vào server!&#10;&eTân thủ hãy gõ lệnh &b/kit help &eđể nhận quà nha.">
          <div class="example-preview"></div>
        </div>
      </div>
    </div>

    <!-- Reference table -->
    <div class="reference-section card">
      <div class="section-title">📋 Bảng mã màu</div>
      <div class="tabs">
        <button class="tab active" data-tab="legacy">Legacy</button>
        <button class="tab" data-tab="minimessage">MiniMessage</button>
        <button class="tab" data-tab="formats">Format</button>
      </div>
      <div class="tab-content active" id="tab-legacy">
        <div class="color-grid" id="legacyGrid"></div>
      </div>
      <div class="tab-content" id="tab-minimessage">
        <div class="mini-table" id="miniTable"></div>
      </div>
      <div class="tab-content" id="tab-formats">
        <div class="format-table" id="formatTable"></div>
      </div>
    </div>
  </div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
